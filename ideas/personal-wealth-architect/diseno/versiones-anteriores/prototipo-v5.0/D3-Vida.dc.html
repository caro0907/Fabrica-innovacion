<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu vida hoy</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6A4E}a:hover{color:#09503A}
input[type=range]{accent-color:#0E6A4E}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; font-family: 'Plus Jakarta Sans', sans-serif; color: #12241F; padding: 22px 18px 18px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><a href="D2-Metas.dc.html" aria-label="Volver" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12241F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #4A5C56">Tu primera reunión · 2 de 4</span><div role="img" aria-label="Paso 2 de 4" style="display: flex; gap: 4px"><span style="width: 22px; height: 8px; border-radius: 4px; background: #0E6A4E"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #0E6A4E"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #E7E2D6"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #E7E2D6"></span></div></div></div>
<h1 style="margin: 0; font-family: 'Newsreader', serif; font-size: 28px; font-weight: 600; line-height: 1.15">Cuéntame de tu vida hoy</h1>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 15px">¿Alguien depende de ti?</strong><span style="font-size: 12.5px; color: #4A5C56; line-height: 1.4">De tu hija solo necesitamos su edad, para su educación y para protegerla.</span><div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{depende}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 15px">¿Dónde vives?</strong><div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{vivienda}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 8px">
<label for="gastos" style="font-size: 15px; font-weight: 700">¿Cuánto gastas al mes, más o menos?</label>
<span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 26px; font-weight: 700">{{gastosTxt}}</span>
<input id="gastos" type="range" min="1000000" max="5000000" step="100000" value="{{gastos}}" onChange="{{onGastos}}" style="width: 100%">
<span style="font-size: 12.5px; color: #4A5C56">Con esto calculamos tu colchón: 3 meses son {{colchonTxt}}.</span>
</div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 10px"><strong style="font-size: 15px">¿Tienes deudas?</strong><div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{deudas}}" as="c" hint-placeholder-count="4">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div></div>
<div style="flex-grow: 1"></div>
<a href="D4-Riesgo.dc.html" style="min-height: 52px; border-radius: 14px; background: #0E6A4E; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Siguiente</a>
</div>

</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { depende: 'Mi hija', vivienda: 'En arriendo', deudas: 'Tarjeta que pago completa', gastos: 2500000 };
}
renderVals() {
var self = this, s = this.state;
function st(on) { return 'min-height: 44px; padding: 0 14px; border-radius: 22px; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid ' + (on ? '#0E6A4E' : '#E7E2D6') + '; background: ' + (on ? '#E3EFEA' : '#FFFFFF') + '; color: #12241F'; }
function fmt(n) { return '$' + (n / 1000000).toFixed(1).replace('.', ',') + ' M'; }
return {
gastos: s.gastos,
gastosTxt: fmt(s.gastos),
colchonTxt: fmt(s.gastos * 3),
onGastos: function (e) { self.setState({ gastos: Number(e.target.value) }); },
depende: ['Nadie','Mi hija','Hijos','Mis padres'].map(function (o) { var on = s.depende === o; return { label: o, on: on ? 'true' : 'false', style: st(on), pick: function () { self.setState({ depende: o }); } }; }),
vivienda: ['En arriendo','Con mi familia','Propia','Con crédito'].map(function (o) { var on = s.vivienda === o; return { label: o, on: on ? 'true' : 'false', style: st(on), pick: function () { self.setState({ vivienda: o }); } }; }),
deudas: ['No','Tarjeta que pago completa','Tarjeta o crédito que pago a cuotas'].map(function (o) { var on = s.deudas === o; return { label: o, on: on ? 'true' : 'false', style: st(on), pick: function () { self.setState({ deudas: o }); } }; })
};
}
}
</script>
</body>
</html>
