<!doctype html>

</div></div>

<div style="background: #FFFFFF; border-radius: 20px; padding: 12px 16px; display: flex; align-items: center; justify-content: space-between; gap: 10px">
<span style="display: flex; flex-direction: column; gap: 2px"><strong style="font-size: 15px">¿Qué edad tiene?</strong><span style="font-size: 12px; color: #4A5C56">Solo eso: para su educación y para protegerla.</span></span>

<button type="button" aria-label="Más" onClick="{{mas}}" style="width: 44px; height: 44px; border-radius: 22px; border: 2px solid #E7E2D6; background: #FFFFFF; font-size: 20px; font-weight: 700; color: #12241F; cursor: pointer">+</button>

<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px"><strong style="font-size: 15px">¿Tienes deudas?</strong><div style="display: flex; flex-direction: column; gap: 8px">

</div></div>
<div style="flex-grow: 1"></div>
<a href="D3b-Dinero.dc.html" style="min-height: 52px; border-radius: 14px; background: #0E6A4E; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; padding: 0 12px">Siguiente</a>
</div>

}

var self = this, s = this.state;

function fmt(n) { return '$' + (n / 1000000).toFixed(1).replace('.', ',') + ' M'; }

conHija: s.depende === 'Mi hija' || s.depende === 'Hijos', edadTxt: s.edad + ' años', menos: function () { self.setState({ edad: Math.max(0, s.edad - 1) }); }, mas: function () { self.setState({ edad: Math.min(25, s.edad + 1) }); }

}
}
</script>
