<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<title>Tu dinero hoy</title>
<meta name="momento" content="Laura · 1 de junio · primera reunión">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&amp;family=Newsreader:opsz,wght@6..72,500;6..72,600&amp;family=Plus+Jakarta+Sans:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#0E6A4E}a:hover{color:#09503A}
input[type=range]{accent-color:#0E6A4E}
summary{list-style-position:inside}
</style>
</helmet>
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #F6F3EC; font-family: 'Plus Jakarta Sans', sans-serif; color: #12241F; padding: 20px 18px 18px; display: flex; flex-direction: column; gap: 11px">
<div style="display: flex; align-items: center; justify-content: space-between; gap: 10px"><a href="D3-Vida.dc.html" aria-label="Volver" style="width: 44px; height: 44px; flex-shrink: 0; display: flex; align-items: center; justify-content: center; border-radius: 22px; background: #FFFFFF"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#12241F" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg></a><div style="display: flex; flex-direction: column; align-items: flex-end; gap: 6px"><span style="font-size: 12px; font-weight: 600; color: #4A5C56">Tu primera reunión · tema 2 de 4</span><div role="img" aria-label="Tema 2 de 4" style="display: flex; gap: 4px"><span style="width: 22px; height: 8px; border-radius: 4px; background: #0E6A4E"></span><span style="width: 22px; height: 8px; border-radius: 4px; background: #0E6A4E"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #E7E2D6"></span><span style="width: 8px; height: 8px; border-radius: 4px; background: #E7E2D6"></span></div></div></div>
<h1 style="margin: 0; font-family: 'Newsreader', serif; font-weight: 600; font-size: 28px; line-height: 1.15">Y tu dinero, más o menos</h1>
<span style="font-size: 14px; line-height: 1.45; color: #2E403A">No necesitas cifras exactas. Con esto vemos tu tranquilidad.</span>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><label for="gastos" style="font-size: 15px; font-weight: 700">¿Cuánto gastas al mes?</label><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">{{gastosTxt}}</span><input id="gastos" type="range" min="1000000" max="5000000" step="100000" value="{{gastos}}" onChange="{{on_gastos}}" style="width: 100%; min-height: 44px; margin: 0"><span style="font-size: 12.5px; color: #4A5C56; line-height: 1.4">Tu colchón de 3 meses sería {{colchonTxt}}.</span></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 6px"><label for="ahorro" style="font-size: 15px; font-weight: 700">¿Cuánto tienes ahorrado o invertido, aquí o en otras entidades?</label><span style="font-family: 'Bricolage Grotesque', sans-serif; font-size: 24px; font-weight: 700">{{ahorroTxt}}</span><input id="ahorro" type="range" min="0" max="30000000" step="500000" value="{{ahorro}}" onChange="{{on_ahorro}}" style="width: 100%; min-height: 44px; margin: 0"></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px"><strong style="font-size: 15px">¿Dónde está?</strong><div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{donde}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div></div>
<div style="background: #FFFFFF; border-radius: 20px; padding: 14px 16px; display: flex; flex-direction: column; gap: 9px"><strong style="font-size: 15px">¿Tienes seguro de vida?</strong><div style="display: flex; flex-wrap: wrap; gap: 8px">
<sc-for list="{{seguro}}" as="c" hint-placeholder-count="3">
<button type="button" aria-pressed="{{c.on}}" onClick="{{c.pick}}" style="{{c.style}}">{{c.label}}</button>
</sc-for>
</div></div>
<div style="flex-grow: 1"></div>
<a href="D4-Riesgo.dc.html" style="min-height: 52px; border-radius: 14px; background: #0E6A4E; color: #FFFFFF; font-weight: 700; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none; text-align: center; padding: 0 12px">Siguiente</a>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
constructor(props) {
super(props);
this.state = { gastos: 2500000, ahorro: 3000000, donde: ['En mi cuenta de ahorros'], seguro: 'No sé' };
}
renderVals() {
var self = this, s = this.state;
function st(on, wide) { return 'min-height: 44px; padding: 0 14px; ' + (wide ? 'text-align: left; border-radius: 14px; ' : 'border-radius: 22px; ') + 'font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer; border: 2px solid ' + (on ? '#0E6A4E' : '#E7E2D6') + '; background: ' + (on ? '#E3EFEA' : '#FFFFFF') + '; color: #12241F'; }
function fmt(n) { return '$' + (n / 1000000).toFixed(1).replace('.', ',') + ' M'; }
return {
donde: ['En mi cuenta de ahorros','En inversiones','En otra entidad'].map(function (o) { var on = s.donde.indexOf(o) >= 0; return { label: o, on: on ? 'true' : 'false', style: st(on, false), pick: function () { var n = s.donde.slice(); var i = n.indexOf(o); if (i >= 0) { n.splice(i, 1); } else { n.push(o); } self.setState({ donde: n }); } }; }),
seguro: ['Sí','No','No sé'].map(function (o) { var on = s.seguro === o; return { label: o, on: on ? 'true' : 'false', style: st(on, false), pick: function () { var o2 = {}; o2['seguro'] = o; self.setState(o2); } }; }),
gastos: s.gastos, gastosTxt: fmt(s.gastos), on_gastos: function (e) { var o2 = {}; o2['gastos'] = Number(e.target.value); self.setState(o2); },
ahorro: s.ahorro, ahorroTxt: fmt(s.ahorro), on_ahorro: function (e) { var o2 = {}; o2['ahorro'] = Number(e.target.value); self.setState(o2); },
colchonTxt: fmt(s.gastos * 3)
};
}
}
</script>
</body>
</html>
