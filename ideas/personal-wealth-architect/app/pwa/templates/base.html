<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block titulo %}Tu arquitecto{% endblock %} · Personal Wealth Architect</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Newsreader:opsz,wght@6..72,500;6..72,600&family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/static/estilos.css">
</head>
<body>
{% block cuerpo %}
<div class="telefono">
  <div class="marco-demo" role="note">
    <span>MVP · datos ficticios · {{ momento|default('') }}</span>
    <a href="/">Reiniciar</a>
  </div>
  <main class="contenido{% if pestana %} con-barra{% endif %}" id="principal">
    {% block contenido %}{% endblock %}
  </main>
  {% if pestana %}
  <nav class="pie" aria-label="Navegación principal">
    <a class="pregunta-barra" href="/pregunta">
      <span class="avatar arq" style="width:26px;height:26px;font-size:11px" aria-hidden="true">A</span>
      Pregúntale algo a tu arquitecto
    </a>
    <div class="pestanas">
      <a href="/inicio" {% if pestana == 'inicio' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M3 11l9-7 9 7v9a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></svg>Inicio</a>
      <a href="/plan" {% if pestana == 'plan' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><path d="M4 19h16M6 15l4-4 3 3 5-6"/></svg>Mi plan</a>
      <a href="/patrimonio" {% if pestana == 'patrimonio' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="12" cy="12" r="8"/><path d="M12 4v8l6 4"/></svg>Patrimonio</a>
      <a href="/equipo" {% if pestana == 'equipo' %}aria-current="page"{% endif %}>
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" aria-hidden="true"><circle cx="9" cy="8" r="3"/><circle cx="17" cy="9" r="2.5"/><path d="M3 20c0-3 3-5 6-5s6 2 6 5M15 15c3 0 6 1.5 6 4.5"/></svg>Tu equipo</a>
    </div>
  </nav>
  {% endif %}
</div>
{% endblock %}
<script src="/static/app.js" defer></script>
</body>
</html>
